name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate action metadata
        run: >-
          python3 -c "import yaml;
          m = yaml.safe_load(open('action.yml'));
          assert m['runs']['using'] == 'composite', m;
          assert {'branch', 'base', 'title', 'github_token'} <= set(m['inputs']), m['inputs'];
          assert 'url' in m.get('outputs', {}), m.get('outputs');
          print('action.yml OK:', m['name'])"
